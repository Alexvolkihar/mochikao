name: Release

# Publie sur npm quand un tag de version est poussé :
#   npm version patch && git push --follow-tags
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # Trusted Publishing : npm vérifie l'identité du workflow via OIDC.
      # Aucun jeton npm stocké, et la preuve d'origine (provenance) est automatique.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Node 24 embarque npm >= 11.5.1, requis par le Trusted Publishing.
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - name: Le tag correspond à la version du package
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # prepublishOnly relance types, tests et build avant l'envoi.
      - run: npm publish
