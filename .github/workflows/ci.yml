name: CI

on:
  push:
    branches: [main]
  pull_request:

# Lecture seule par défaut : la CI n'a besoin de rien d'autre.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, tests et build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Le développement exige Node >= 22.18 (exécution directe du TypeScript).
        node: ['22', '24']
    steps:
      # Actions figées par SHA : un tag peut être déplacé, pas un commit.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:site

  package:
    name: Paquet publiable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      # Ce qui part chez les utilisateurs : aucune dépendance vulnérable tolérée.
      - run: npm audit --omit=dev --audit-level=moderate
      - run: npx --yes publint@0.3 --strict
      - run: npm pack --dry-run
